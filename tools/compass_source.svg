<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<defs>
  <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c4"/><stop offset=".45" stop-color="#e9bd78"/><stop offset="1" stop-color="#b9824a"/></linearGradient>
  <linearGradient id="drk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58f52"/><stop offset=".5" stop-color="#8d5b30"/><stop offset="1" stop-color="#4f3019"/></linearGradient>
  <linearGradient id="litD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b676"/><stop offset="1" stop-color="#8d5b30"/></linearGradient>
  <linearGradient id="drkD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a3a"/><stop offset="1" stop-color="#3f2814"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c98a"/><stop offset=".5" stop-color="#986a42"/><stop offset="1" stop-color="#3a2a1c"/></linearGradient>
  <radialGradient id="disc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1a1410"/><stop offset=".75" stop-color="#0d0c0a"/><stop offset="1" stop-color="#070605"/></radialGradient>
  <radialGradient id="jewel" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#fff6d8"/><stop offset=".5" stop-color="#e5ae52"/><stop offset="1" stop-color="#7a4d1f"/></radialGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feColorMatrix in="b" values="0 0 0 0 .9  0 0 0 0 .65  0 0 0 0 .3  0 0 0 .5 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <!-- pointe cardinale : deux facettes (éclairée à gauche, ombrée à droite) -->
  <g id="cardinal">
    <polygon points="500,52 442,442 500,500" fill="url(#lit)"/>
    <polygon points="500,52 558,442 500,500" fill="url(#drk)"/>
    <polyline points="500,52 442,442 500,500 558,442 500,52" fill="none" stroke="#fff0c4" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="500" y1="70" x2="500" y2="480" stroke="#fff6d8" stroke-opacity=".45" stroke-width="1.5"/>
  </g>
  <g id="inter">
    <polygon points="500,250 462,462 500,500" fill="url(#litD)"/>
    <polygon points="500,250 538,462 500,500" fill="url(#drkD)"/>
    <polyline points="500,250 462,462 500,500 538,462 500,250" fill="none" stroke="#e2b676" stroke-opacity=".5" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g id="tickset">
    <g stroke="#b9824a" stroke-linecap="round">
      <g id="t5"><line x1="500" y1="158" x2="500" y2="172" stroke-width="2"/></g>
    </g>
  </g>
</defs>

